<!DOCTYPE html>
<html>

<head>
    <title>Study With Me ♡</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="welcome">

        <div class="sparkles">
            ✧ ˚ 🎀 ˚ ✧
        </div>

        <h1>
            STUDY WITH ME ♡
        </h1>

        <p>
            Create your cozy study corner ✨
        </p>

        <!-- Added the onclick="enterRoom()" here so it functions! -->
        <button onclick="enterRoom()">
            Enter my study room 🎀
        </button>

        <div class="quote">
            "Dream big, study softly, become your best self ♡"
        </div>

    </div>
    
    <div id="room">

        <h2>
            MY STUDY ROOM ♡
        </h2>

        <p>
            Your cozy productivity corner 🎀
        </p>

        <div class="cards">

            <div class="card">
                ⏳
                <h3>Pomodoro</h3>
            </div>

            <div class="card">
                📅
                <h3>Weekly Planner</h3>
            </div>

            <div class="card">
                💿
                <h3>Vinyl Corner</h3>
            </div>

            <div class="card">
                ✅
                <h3>To Do List</h3>
            </div>

        </div>

    </div>
</body>

</html>
